{% extends 'base.html' %}
{% block title %}404 - Document / Page Not Found{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
    <div class="card" style="padding: 2.5rem 1.5rem;">
        <span style="font-size: 3rem;">🔍</span>
        <h1 style="font-size: 2rem; font-weight: 800; color: #0f172a; margin: 0.5rem 0;">404 Not Found</h1>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem;">
            The requested forensic dossier, document record, or system page could not be located.
        </p>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
