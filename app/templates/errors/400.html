{% extends 'base.html' %}
{% block title %}400 - Invalid Request{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
    <div class="card" style="padding: 2.5rem 1.5rem;">
        <span style="font-size: 3rem;">⚠️</span>
        <h1 style="font-size: 2rem; font-weight: 800; color: #0f172a; margin: 0.5rem 0;">Invalid Request</h1>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem;">
            The submitted payload or file format could not be processed by the forensic validation layer.
        </p>
        <a href="{{ url_for('verify.upload_and_verify') }}" class="btn btn-primary">Back to Upload</a>
    </div>
</div>
{% endblock %}
