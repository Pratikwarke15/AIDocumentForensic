{% extends 'base.html' %}

{% block title %}Login - AI Forensics System{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <span style="font-size: 2.2rem;">🔐</span>
            <h2 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-top: 0.5rem;">Secure Login</h2>
            <p style="font-size: 0.85rem; color: #64748b;">Sign in to access document verification and history</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label class="form-label" for="username">Username or Email</label>
                <input type="text" name="username" id="username" class="form-control" required autofocus placeholder="admin or demo">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem;">
                Sign In
            </button>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; font-size: 0.8rem; color: #64748b;">
            <div style="background: #f8fafc; padding: 0.75rem; border-radius: 6px; border: 1px solid #e2e8f0; margin-bottom: 1rem;">
                <strong>Demo Credentials:</strong><br/>
                • Admin: <code>admin</code> / <code>Admin@12345</code><br/>
                • User: <code>demo</code> / <code>Demo@12345</code>
            </div>
            <div style="text-align: center;">
                Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: #0284c7; font-weight: 600;">Register here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
